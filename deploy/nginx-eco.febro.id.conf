# Proposed configuration only. Install after approval and certificate verification.
# Requires a certificate covering eco.febro.id at the paths below.
server {
    listen 80;
    listen [::]:80;
    server_name eco.febro.id;
    access_log off;
    return 301 https://eco.febro.id$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name eco.febro.id;
    ssl_certificate /etc/letsencrypt/live/eco.febro.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eco.febro.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 9m;
    access_log off; # OAuth/reset query parameters must not be logged.
    error_log /var/log/nginx/febro-eco-error.log warn;
    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_pass http://127.0.0.1:3470;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
