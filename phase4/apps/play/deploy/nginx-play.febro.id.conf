# Febro Arcade — static HTML/CSS/JS, no Node or PM2 required.
# Copy to /etc/nginx/conf.d/play.febro.id.conf
server {
    listen 80;
    listen [::]:80;
    server_name play.febro.id;

    root /opt/play;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /skyhop { return 301 /skyhop/; }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js|svg|png|webp|ico)$ {
        expires 1h;
        try_files $uri =404;
    }

    # Deploy config/README must not be exposed from document root.
    location ^~ /deploy/ { return 404; }
    location = /README-INSTALL.md { return 404; }
    location ~* \.(zip|log|conf)$ { return 404; }
    location ~ /\. { deny all; }
}
