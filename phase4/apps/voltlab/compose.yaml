name: voltlab
services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: voltlab
      POSTGRES_USER: voltlab
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run node scripts/setup-env.mjs first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voltlab -d voltlab"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]
  app:
    build: .
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:?Set APP_URL}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET}
      DATABASE_URL: postgresql://voltlab:${DB_PASSWORD}@db:5432/voltlab
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    ports:
      - "127.0.0.1:${APP_PORT:-3025}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 45s
      retries: 3
    networks: [internal]
networks:
  internal:
volumes:
  postgres_data:
