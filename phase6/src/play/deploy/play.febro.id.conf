# Febro Arcade — everything under /opt/play; ONLY /opt/play/public is web-accessible.
# This vhost is based on the owner's original Certbot configuration for play.febro.id.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name play.febro.id;

    root /opt/play/public;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # IMPORTANT: Both location blocks belong INSIDE this HTTPS server block.
    location ^~ /api/leaderboard/ {
        proxy_pass http://127.0.0.1:3488;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location ^~ /api/tribeworld/ {
        proxy_pass http://127.0.0.1:3491;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 300k;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }

    location = /skyhop { return 301 /skyhop/; }
    location / { try_files $uri $uri/ =404; }

    location ~* \.(css|js|svg|png|webp|ico|jpg|jpeg|mp4|woff2)$ {
        expires 1h;
        try_files $uri =404;
    }

    # Never expose deployment metadata if copied into /public accidentally.
    location ^~ /deploy/ { return 404; }
    location = /README-INSTALL.md { return 404; }
    location ~* \.(zip|log|conf|sqlite|sqlite-wal|sqlite-shm|db|env)$ { return 404; }
    location ~ /\. { deny all; }

    ssl_certificate /etc/letsencrypt/live/play.febro.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/play.febro.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name play.febro.id;
    return 301 https://$host$request_uri;
}
