# One backend, ten DNS names. Enable HTTPS with certbot --nginx after DNS resolves.
# Keep the old /opt/receipt, /opt/server-health, etc. configurations unchanged.
server {
    listen 80;
    listen [::]:80;
    server_name tools.febro.id lab.febro.id api.febro.id docs.febro.id
                qr.febro.id convert.febro.id snip.febro.id short.febro.id
                verify.febro.id auth.febro.id;
    client_max_body_size 9m;
    access_log off; # Avoid logging reset-password/OAuth tokens in query strings.
    error_log /var/log/nginx/febro-ecosystem-error.log warn;
    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_pass http://127.0.0.1:3470;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_request_buffering on;
    }
}
