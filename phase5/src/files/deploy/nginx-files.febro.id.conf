# Add only after DNS for files.febro.id points to the VPS.
# Certbot will edit this vhost for TLS and HTTP -> HTTPS redirect.
server {
 listen 80;
 listen [::]:80;
 server_name files.febro.id;
 client_max_body_size 1m;
 access_log off;
 error_log /var/log/nginx/febro-files-error.log warn;
 # Stream upload bytes without first buffering a 512MB anonymous request to Nginx disk.
 location = /api/upload {
  client_max_body_size 513m;
  proxy_pass http://127.0.0.1:3480;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Connection "";
  proxy_request_buffering off;
  proxy_read_timeout 180s;
  proxy_send_timeout 180s;
 }
 location / {
  proxy_pass http://127.0.0.1:3480;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Connection "";
  proxy_request_buffering on;
  proxy_read_timeout 180s;
  proxy_send_timeout 180s;
  proxy_connect_timeout 10s;
 }
}
